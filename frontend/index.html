<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Monitoreo Judicial</title>
    <style>
      /* Paleta institucional inspirada en documentos legales: tinta, papel, verde y dorado sobrio. */
      :root {
        --ink: #14232b;
        --muted: #61717a;
        --line: #d9e2e3;
        --surface: #ffffff;
        --page: #f3f1eb;
        --nav: #142832;
        --nav-2: #213b46;
        --accent: #1f6a55;
        --accent-2: #2d8369;
        --gold: #b68a3c;
        --paper: #fbfaf6;
        --soft: #e9f0ed;
        --warn: #9a6d1d;
        --danger: #a3443c;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* Controles base compartidos por formularios, acciones y carga de archivos. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 12%, rgba(182, 138, 60, .12), transparent 28%),
          linear-gradient(135deg, #f7f5ef 0%, var(--page) 48%, #edf4f1 100%);
      }
      button, input, textarea, select { font: inherit; }
      button, .fileButton {
        min-height: 38px;
        border: 1px solid var(--nav);
        border-radius: 6px;
        background: var(--nav);
        color: white;
        padding: 0 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 10px 22px rgba(20, 40, 50, .12);
        transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      }
      button:hover, .fileButton:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(20, 40, 50, .16); }
      button.secondary, .fileButton { background: white; color: var(--nav); box-shadow: 0 6px 16px rgba(20, 40, 50, .08); }
      button.ghost { background: transparent; color: inherit; border-color: transparent; }
      button.danger { background: var(--danger); border-color: var(--danger); color: white; }
      button:disabled { opacity: .55; cursor: wait; }
      input, textarea, select {
        min-height: 38px;
        border: 1px solid #cbd7da;
        border-radius: 6px;
        background: white;
        padding: 8px 10px;
        transition: border-color .18s ease, box-shadow .18s ease;
      }
      input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31, 106, 85, .12); outline: none; }
      textarea { width: 100%; min-height: 120px; resize: vertical; }
      a { color: var(--accent); }
      /* Pantalla de autenticacion: primera entrada al sistema comercial. */
      .login {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(320px, 460px) 1fr;
      }
      .loginForm {
        background: rgba(255, 255, 255, .92);
        padding: 44px;
        display: grid;
        align-content: center;
        gap: 16px;
        border-right: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .loginForm h1 { margin: 0; font-size: 30px; }
      .loginAside {
        padding: 44px;
        display: grid;
        align-content: center;
        background:
          linear-gradient(135deg, rgba(20, 40, 50, .88), rgba(31, 106, 85, .78)),
          linear-gradient(45deg, #142832, #1f6a55);
        color: white;
        position: relative;
        overflow: hidden;
      }
      .loginAside::before {
        content: "§";
        position: absolute;
        right: 8%;
        bottom: 4%;
        color: rgba(255,255,255,.08);
        font-size: 220px;
        font-family: Georgia, serif;
        transform: rotate(-12deg);
      }
      .loginAside h2 { max-width: 680px; font-size: 42px; margin: 0 0 12px; }
      .loginAside p { max-width: 680px; color: #ddebe7; font-size: 18px; }
      /* Layout principal: navegacion lateral fija y area de trabajo. */
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
      }
      .sidebar {
        background: linear-gradient(180deg, var(--nav) 0%, var(--nav-2) 100%);
        color: white;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        box-shadow: 18px 0 36px rgba(20, 40, 50, .12);
      }
      .brand { border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: 16px; }
      .brand h1 { margin: 0 0 4px; font-size: 19px; }
      .brand p { margin: 0; color: #b8c6ca; font-size: 13px; }
      .nav { display: grid; gap: 6px; }
      .nav button {
        border-color: transparent;
        background: transparent;
        text-align: left;
        justify-content: flex-start;
        color: #dce8eb;
        box-shadow: none;
      }
      .nav button.active { background: rgba(255,255,255,.13); color: white; border-color: rgba(182, 138, 60, .42); }
      .sidebarFooter { margin-top: auto; display: grid; gap: 8px; }
      .supportButton {
        min-height: 40px;
        border: 1px solid rgba(37, 211, 102, .35);
        border-radius: 6px;
        background: #25d366;
        color: #0c2f1b;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 750;
        box-shadow: 0 10px 22px rgba(37, 211, 102, .16);
      }
      .supportButton svg { width: 18px; height: 18px; flex: 0 0 auto; }
      .developerCredit {
        color: #dce8eb;
        font-size: 12px;
        line-height: 1.45;
        margin: 2px 0 0;
      }
      .developerCredit a { color: #f2d89f; text-decoration: none; overflow-wrap: anywhere; }
      /* Componentes de datos: metricas, paneles, tablas y estados. */
      .main { padding: 26px; display: grid; gap: 16px; align-content: start; animation: fadeIn .28s ease both; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
      .topbar h2 { margin: 0; font-size: 25px; }
      .muted { color: var(--muted); margin: 4px 0 0; }
      .grid { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 12px; }
      .metric, .panel {
        background: rgba(255, 255, 255, .92);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 18px 42px rgba(20, 40, 50, .07);
      }
      .metric { padding: 15px; position: relative; overflow: hidden; }
      .metric::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--gold), var(--accent)); }
      .metric span { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0; }
      .metric strong { font-size: 28px; }
      .panel { padding: 16px; display: grid; gap: 13px; }
      .panel h3 { margin: 0; font-size: 17px; }
      .panelHeader { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .field { display: grid; gap: 6px; }
      .field span { color: var(--muted); font-size: 12px; font-weight: 650; text-transform: uppercase; }
      .helpBox {
        border: 1px solid #cfe0dc;
        background: #f2f8f6;
        border-radius: 8px;
        padding: 12px;
        display: grid;
        gap: 8px;
      }
      .helpBox p { margin: 0; color: #42535a; }
      .helpBox ol { margin: 0; padding-left: 18px; color: #42535a; display: grid; gap: 4px; }
      .actionPanel {
        background: linear-gradient(135deg, #ffffff 0%, #f4f1e8 46%, #edf7f3 100%);
        border-color: #cfe0dc;
      }
      .split { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
      .tableWrap { overflow: auto; }
      table { width: 100%; min-width: 920px; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #e6ecee; padding: 11px; text-align: left; vertical-align: top; font-size: 13px; }
      th { color: var(--muted); font-weight: 650; background: #fbfaf6; position: sticky; top: 0; z-index: 1; }
      tr { transition: background .16s ease; }
      tbody tr:hover { background: #f7faf8; }
      .badge { display: inline-block; border-radius: 999px; padding: 4px 8px; font-size: 12px; background: #e7f2ed; color: var(--accent); }
      .badge.warn { background: #fff3d8; color: var(--warn); }
      .badge.error { background: #fde7e4; color: var(--danger); }
      .badge.important { background: #ffe1de; color: var(--danger); border: 1px solid #f4aaa2; font-weight: 750; }
      .log { background: #142228; color: #dce9eb; border-radius: 6px; padding: 12px; min-height: 92px; white-space: pre-wrap; overflow: auto; }
      .progressCard { border-color: #bad7d0; background: #fbfdfc; }
      /* Barra de progreso del scraper para ejecuciones largas de Selenium. */
      .progressTrack {
        height: 14px;
        background: #dfe9e8;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid #cfdddc;
      }
      .progressFill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width .35s ease;
      }
      .progressFill.active {
        background-image: linear-gradient(90deg, var(--accent), var(--accent-2)), repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 10px, transparent 10px 20px);
        background-blend-mode: screen;
        animation: progressGlow 1.4s ease-in-out infinite alternate;
      }
      .progressMeta { display: grid; grid-template-columns: repeat(3, minmax(110px, 1fr)); gap: 10px; }
      .progressMeta div { background: var(--soft); border-radius: 8px; padding: 10px; }
      .progressMeta span { display: block; color: var(--muted); font-size: 12px; }
      .progressMeta strong { font-size: 18px; }
      .timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
      .timeline li { border-left: 3px solid var(--accent); padding: 3px 0 3px 12px; }
      .judicialPage {
        background: #fff;
        border: 0;
        border-radius: 0;
        overflow: hidden;
        box-shadow: none;
      }
      .judicialStandalone {
        min-height: 100vh;
        background: #fff;
        color: #06192f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .judicialTop {
        height: 39px;
        background: #2d437d;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 21vw;
      }
      .judicialTop button { min-height: 39px; border-radius: 0; background: #ffc12d; border-color: #ffc12d; color: white; box-shadow: none; font-weight: 700; }
      .judicialBody { padding: 30px 5.4vw 56px; background: #fff; position: relative; }
      .judicialActions { display: grid; grid-template-columns: 140px 1fr 420px; align-items: start; gap: 16px; margin: 18px 0 36px; }
      .homeIcon {
        width: 42px;
        min-height: 42px;
        color: #365f95;
        font-size: 12px;
        line-height: 1;
        justify-self: center;
        background: transparent;
        border: 0;
        box-shadow: none;
        padding: 0;
      }
      .sideBack {
        position: fixed;
        left: 16px;
        top: 320px;
        color: #1e77ef;
        text-decoration: none;
        font-size: 14px;
        background: transparent;
        border: 0;
        box-shadow: none;
      }
      .printBubble {
        position: fixed;
        left: 8px;
        top: 50vh;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #e93463;
        border-color: #e93463;
        color: white;
        box-shadow: none;
        z-index: 3;
      }
      .roundIcon {
        width: 34px;
        height: 34px;
        border: 1px solid #c6d9f5;
        border-radius: 50%;
        color: #1687ff;
        background: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        padding: 0;
        min-height: 34px;
      }
      .identifierSearch {
        width: 190px;
        border-radius: 999px;
        padding-left: 44px;
        background: #fff;
        box-shadow: 0 10px 22px rgba(26, 52, 88, .08);
        color: #8f9ba7;
        justify-self: end;
        font-style: italic;
      }
      .judicialToolbox { display: flex; gap: 18px; align-items: center; justify-content: flex-end; }
      .newActionGroup {
        border: 1px solid #2e66ff;
        border-radius: 28px;
        padding: 9px 12px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      .newActionGroup span { color: #338aff; font-size: 13px; }
      .judicialTitle {
        color: #2c73e8;
        margin: 0 0 58px;
        font-size: 24px;
        font-weight: 750;
      }
      .previousLife { margin-left: 16px; color: #2b7cff; font-size: 13px; text-decoration: none; font-weight: 500; }
      .lifeGrid {
        display: grid;
        grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr) minmax(280px, 1fr);
        gap: 8px;
        align-items: start;
      }
      .lifeSection { border: 1px solid #dce5ef; background: white; }
      .lifeSectionTitle {
        background: #095895;
        color: white;
        font-weight: 750;
        padding: 8px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
      }
      .lifeTable { width: 100%; min-width: 0; border-collapse: collapse; }
      .lifeTable th, .lifeTable td { border: 1px solid #dfe7ef; padding: 5px 10px; font-size: 13px; color: #000; }
      .lifeTable th { background: #e8edf2; color: #20323c; position: static; font-weight: 700; }
      .lifeFull { grid-column: 1 / -1; margin-top: 34px; }
      .instanceButton {
        min-height: 24px;
        border-radius: 2px;
        background: #2c73e8;
        border-color: #2c73e8;
        font-size: 12px;
        padding: 0 10px;
        box-shadow: none;
        margin-top: 30px;
      }
      .actHeader {
        background: #287536;
        color: white;
        text-align: center;
        font-weight: 750;
        padding: 10px;
      }
      .actTable { width: 100%; min-width: 980px; border-collapse: collapse; }
      .actTable th { background: #c9f1df; color: #31575d; position: static; }
      .actTable th, .actTable td { border: 1px solid #bfe3d0; padding: 6px 14px; font-size: 13px; color: #000; }
      .searchHero {
        display: grid;
        grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .resultCard {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 14px;
        display: grid;
        gap: 10px;
      }
      .portalDashboard {
        min-height: 100vh;
        background: #fff;
        color: #09205e;
        font-family: Arial, Helvetica, sans-serif;
      }
      .portalStrip { height: 25px; background: #0e6380; border-bottom: 1px solid #0a4a60; }
      .portalHeader {
        height: 115px;
        border-bottom: 4px solid #b8b8b8;
        display: grid;
        grid-template-columns: 300px 1fr 360px;
        align-items: center;
        padding: 0 52px;
        background: white;
      }
      .portalLogo strong { display: block; color: #233168; font-size: 34px; line-height: .9; letter-spacing: -1px; }
      .portalLogo span { color: #263d74; font-size: 12px; }
      .portalLogo .arc { display: inline-block; color: #4fa7d4; font-size: 42px; transform: translateY(6px); }
      .contactBox {
        width: 78px;
        height: 76px;
        background: #12a6bd;
        color: white;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 750;
      }
      .portalIcons { display: flex; gap: 8px; align-items: center; color: #355482; font-size: 12px; }
      .portalFrame {
        display: grid;
        grid-template-columns: 282px minmax(0, 1fr);
        gap: 0;
        min-height: calc(100vh - 140px);
      }
      .portalLeft { padding: 32px 0 0 43px; }
      .portalUserCard {
        width: 236px;
        border-radius: 14px;
        overflow: hidden;
        background: #465a8c;
        color: white;
      }
      .portalUserName { padding: 10px 12px; text-align: center; font-size: 17px; line-height: 1.3; }
      .portalMenu { display: grid; }
      .portalMenu button {
        min-height: 19px;
        border: 0;
        border-top: 1px solid #092243;
        border-radius: 0;
        background: #3295a7;
        color: white;
        justify-content: flex-start;
        padding: 0 7px;
        font-size: 11px;
        font-weight: 700;
        box-shadow: none;
      }
      .portalMenu button.active { background: #1186ff; }
      .portalLogout {
        min-height: 26px;
        border: 0;
        border-radius: 0;
        background: #465a8c;
        color: white;
        width: 100%;
        font-size: 18px;
        box-shadow: none;
      }
      .portalCompany {
        width: 236px;
        margin-top: 40px;
        text-align: center;
        color: #2438ff;
        font-size: 8px;
        line-height: 1.2;
      }
      .portalContent {
        margin: 12px 43px 0 0;
        min-height: 73vh;
        border: 1px solid #3232ff;
        border-bottom-color: #111;
        border-radius: 10px;
        position: relative;
        padding: 0 0 42px;
        overflow: hidden;
      }
      .portalBreadcrumb { padding: 5px; font-size: 14px; color: #321dff; text-decoration: underline; }
      .notificationPanel { width: 490px; margin: 18px auto 0; }
      .notificationTitle { background: #465a8c; color: white; padding: 3px 6px; font-size: 16px; }
      .dayCards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
      .dayCard { background: #8fb9df; color: white; text-align: center; }
      .dayCard strong { display: block; font-size: 68px; line-height: .95; font-weight: 300; }
      .dayCard span { display: block; font-size: 12px; padding-bottom: 8px; }
      .dayCard small { display: block; background: #334c84; padding: 3px; font-size: 12px; font-weight: 700; }
      .portalRefresh { text-align: center; color: #e8f1fb; font-size: 150px; line-height: .8; margin: 32px 0 12px; }
      .portalMessage { text-align: center; color: #0d2f87; font-size: 14px; }
      .portalStats {
        width: min(780px, calc(100% - 80px));
        margin: 38px auto 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .portalStat { border: 1px solid #c8d9ea; background: #f6fbff; padding: 8px; text-align: center; }
      .portalStat span { display: block; color: #465a8c; font-size: 11px; font-weight: 700; text-transform: uppercase; }
      .portalStat strong { color: #102f79; font-size: 22px; }
      .portalQuickActions { margin: 20px auto 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      .portalQuickActions button, .portalQuickActions a {
        min-height: 26px;
        border-radius: 0;
        border: 1px solid #244b7a;
        background: #3295a7;
        color: white;
        font-size: 12px;
        padding: 0 12px;
        box-shadow: none;
        text-decoration: none;
      }
      .portalFooterText {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        text-align: center;
        color: #0d2f87;
        font-size: 12px;
      }
      .portalTopTabs { display: flex; align-items: end; gap: 8px; justify-content: flex-start; }
      .portalTopTabs button {
        width: 102px;
        height: 76px;
        border: 0;
        border-radius: 0;
        background: #12a6bd;
        color: white;
        font-size: 11px;
        font-weight: 750;
        box-shadow: none;
        padding: 0 6px;
      }
      .portalTopTabs span { color: #111b55; font-size: 11px; font-weight: 700; margin-right: 4px; }
      .processSearchPanel {
        width: calc(100% - 64px);
        margin: 16px auto 0;
        border: 2px inset #d9dee6;
        min-height: 172px;
      }
      .processSearchTitle {
        text-align: center;
        color: #08005e;
        font-size: 12px;
        padding: 4px 0 0;
      }
      .processSearchForm {
        display: grid;
        grid-template-columns: 174px minmax(320px, 450px) minmax(220px, 1fr);
        align-items: start;
        margin-top: 0;
      }
      .processLabelColumn {
        background: #438dcc;
        color: #15256c;
        display: grid;
        gap: 0;
        padding: 9px 0 8px;
      }
      .processLabelColumn label {
        height: 22px;
        text-align: right;
        padding-right: 55px;
        font-size: 13px;
        color: #142b72;
      }
      .processInputColumn {
        display: grid;
        gap: 2px;
        padding: 15px 0 0;
      }
      .processInputColumn input,
      .processInputColumn select {
        width: 100%;
        height: 20px;
        min-height: 20px;
        border: 1px solid #777;
        border-radius: 0;
        padding: 1px 4px;
        box-shadow: none;
        font-size: 12px;
      }
      .processInputColumn .shortField { width: 140px; }
      .processInputColumn .mediumField { width: 278px; }
      .processSearchButton {
        align-self: end;
        justify-self: start;
        margin: 136px 0 0 32px;
        width: 94px;
        min-height: 18px;
        height: 18px;
        border-radius: 999px;
        background: #292274;
        border-color: #292274;
        color: white;
        font-size: 12px;
        font-weight: 750;
        box-shadow: none;
      }
      .clientBaseBar {
        width: calc(100% - 64px);
        margin: 10px auto 0;
        display: flex;
        gap: 8px;
        align-items: center;
        color: #08005e;
        font-size: 12px;
      }
      .clientBaseBar select {
        width: 260px;
        min-height: 24px;
        height: 24px;
        border-radius: 0;
        font-size: 12px;
      }
      .searchResultsPortal {
        width: calc(100% - 64px);
        margin: 18px auto 0;
        color: #071a58;
        font-size: 12px;
      }
      .searchResultsPortal table {
        min-width: 900px;
        border: 1px solid #aeb9c6;
      }
      .searchResultsPortal th {
        background: #e6eef8;
        color: #071a58;
        position: static;
        padding: 6px;
      }
      .searchResultsPortal td { padding: 6px; color: #071a58; }
      .workbenchHero {
        display: grid;
        grid-template-columns: minmax(280px, 1.2fr) minmax(280px, .8fr);
        gap: 16px;
        align-items: stretch;
      }
      .commandBand {
        background: linear-gradient(135deg, #12313d 0%, #1e6957 100%);
        color: white;
        border-radius: 8px;
        padding: 18px;
        display: grid;
        gap: 16px;
        min-height: 210px;
      }
      .commandBand h3 { margin: 0; font-size: 24px; }
      .commandBand p { margin: 0; color: #d8ebe7; max-width: 780px; }
      .commandActions { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
      .commandActions select {
        min-width: 240px;
        border-color: rgba(255,255,255,.35);
      }
      .moduleGrid {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: 12px;
      }
      .moduleCard {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        display: grid;
        gap: 8px;
        box-shadow: 0 14px 34px rgba(20, 40, 50, .06);
      }
      .moduleCard strong { font-size: 15px; }
      .moduleCard span { color: var(--muted); font-size: 13px; min-height: 38px; }
      .moduleCard button, .moduleCard a { width: fit-content; min-height: 32px; }
      .statusList { display: grid; gap: 10px; }
      .statusItem {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 11px;
        border: 1px solid #dce7e7;
        border-radius: 8px;
        background: #f8fbfa;
      }
      .searchWorkbench {
        display: grid;
        grid-template-columns: minmax(320px, 460px) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .searchFormGrid { display: grid; gap: 10px; }
      .searchFormGrid .twoCols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .sectionToolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .detailHeader {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        display: grid;
        gap: 12px;
      }
      .detailTitleRow { display: flex; justify-content: space-between; gap: 12px; align-items: start; flex-wrap: wrap; }
      .detailTitleRow h3 { margin: 0; font-size: 24px; }
      .detailGrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(220px, 1fr));
        gap: 12px;
      }
      .infoBlock {
        border: 1px solid #dce7e7;
        border-radius: 8px;
        background: #fbfdfc;
        padding: 12px;
        display: grid;
        gap: 6px;
      }
      .infoBlock span { color: var(--muted); font-size: 12px; text-transform: uppercase; font-weight: 700; }
      .actuationCard {
        border: 1px solid #dce7e7;
        border-radius: 8px;
        background: white;
        padding: 12px;
        display: grid;
        gap: 8px;
      }
      .actuationCard.importantAct { border-color: #f3aaa3; background: #fff8f7; }
      /* Drawer lateral para ver detalle e historial sin abandonar la tabla. */
      .drawer {
        position: fixed;
        inset: 0;
        display: none;
        background: rgba(12, 22, 27, .28);
        justify-content: flex-end;
      }
      .drawer.open { display: flex; }
      .drawerPanel {
        width: min(1320px, 96vw);
        background: white;
        padding: 0;
        overflow: auto;
        display: grid;
        gap: 0;
        animation: slideIn .2s ease both;
      }
      .empty { padding: 18px; color: var(--muted); background: #f8faf9; border: 1px dashed var(--line); border-radius: 8px; }
      /* Animaciones discretas para dar feedback sin afectar lectura operativa. */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(22px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes progressGlow {
        from { filter: saturate(1); }
        to { filter: saturate(1.25) brightness(1.04); }
      }
      @media (max-width: 980px) {
        .login, .app, .split, .searchHero, .lifeGrid { grid-template-columns: 1fr; }
        .loginAside { display: none; }
        .grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
        .progressMeta { grid-template-columns: 1fr; }
        .sidebar { position: sticky; top: 0; z-index: 2; }
        .judicialBody { padding: 22px; }
        .lifeFull { grid-column: auto; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="drawer" class="drawer" onclick="closeDrawer(event)"></div>
    <script>
      const API = `${window.location.protocol}//${window.location.hostname}:8010`;
      // Estado central de la SPA. Se conserva lo minimo en localStorage para restaurar sesion y vista.
      const state = {
        token: localStorage.getItem("token") || "",
        refreshToken: localStorage.getItem("refresh_token") || "",
        view: localStorage.getItem("view") || "dashboard",
        busy: false,
        resumen: {},
        radicados: [],
        clientes: [],
        procesos: [],
        reportes: [],
        notificaciones: [],
        programacion: null,
        organizacion: null,
        me: null,
        usuarios: [],
        auditoria: [],
        consultas: [],
        activeConsulta: null,
        poller: null,
        selected: null,
        previousView: localStorage.getItem("view") || "procesos",
        selectedCliente: localStorage.getItem("selected_cliente") || "",
        selectedRadicados: [],
        procesoSearch: "",
        busquedaPublicaciones: null,
        busquedaLoading: false,
        log: "Sistema listo. Carga radicados y ejecuta el scraper.",
        filtros: { radicado: "", juzgado: "", fecha: "", estado: "", cliente: "", nombre: "", demandante: "", demandado: "" },
      };
      const app = document.getElementById("app");
      const drawer = document.getElementById("drawer");

      // Renueva el access token cuando la sesion sigue viva por refresh token.
      async function refreshSession() {
        if (!state.refreshToken) return false;
        try {
          const data = await request("/auth/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refresh_token: state.refreshToken }),
          }, false);
          state.token = data.access_token;
          state.refreshToken = data.refresh_token || "";
          localStorage.setItem("token", state.token);
          localStorage.setItem("refresh_token", state.refreshToken);
          return true;
        } catch {
          localStorage.removeItem("token");
          localStorage.removeItem("refresh_token");
          state.token = "";
          state.refreshToken = "";
          render();
          return false;
        }
      }

      // Cliente HTTP con reintento automatico ante 401 para evitar cortes durante cargas y scraping.
      async function request(path, options = {}, retryAuth = true) {
        const response = await fetch(`${API}${path}`, options);
        const text = await response.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
        if (response.status === 401 && retryAuth && await refreshSession()) {
          const nextOptions = { ...options };
          nextOptions.headers = { ...(options.headers || {}), Authorization: `Bearer ${state.token}` };
          return request(path, nextOptions, false);
        }
        if (!response.ok) throw new Error(data.detail || text || "Error de solicitud");
        return data;
      }
      const headers = () => ({ Authorization: `Bearer ${state.token}` });
      const jsonHeaders = () => ({ ...headers(), "Content-Type": "application/json" });
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
      const clientes = () => [...new Set([...(state.clientes || []).map((c) => c.nombre), ...state.radicados.map((r) => r.etiqueta)].filter(Boolean))].sort();
      const clienteActual = () => (state.selectedCliente || "").trim();
      function clienteOptions(selected = "") {
        return `<option value="">Todos los clientes</option>${clientes().map((c) => `<option value="${esc(c)}" ${selected === c ? "selected" : ""}>${esc(c)}</option>`).join("")}`;
      }
      function setCliente(value) {
        state.selectedCliente = value;
        state.filtros.cliente = value;
        localStorage.setItem("selected_cliente", value);
        render();
      }

      // Utilidades de estado visual y navegacion.
      function setLog(message, payload) {
        state.log = payload ? `${message}\n${JSON.stringify(payload, null, 2)}` : message;
        render();
      }
      function setView(view) {
        state.view = view;
        localStorage.setItem("view", view);
        render();
      }
      // Autenticacion y cierre de sesion.
      async function login(event) {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          const data = await request("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: form.get("email"), password: form.get("password") }),
          });
          state.token = data.access_token;
          state.refreshToken = data.refresh_token || "";
          localStorage.setItem("token", state.token);
          localStorage.setItem("refresh_token", state.refreshToken);
          await refresh();
        } catch (error) {
          setLog(`No se pudo iniciar sesion: ${error.message}`);
        }
      }
      async function logout() {
        if (state.refreshToken) {
          try {
            await request("/auth/logout", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ refresh_token: state.refreshToken }),
            });
          } catch {}
        }
        localStorage.removeItem("token");
        localStorage.removeItem("refresh_token");
        state.token = "";
        state.refreshToken = "";
        render();
      }
      // Refresca todos los datos operativos del dashboard en paralelo.
      async function refresh() {
        if (!state.token) return render();
        try {
          const [me, resumen, radicados, clientesData, procesos, reportes, notificaciones, consultas, programacion, organizacion, usuarios, auditoria] = await Promise.all([
            request("/auth/me", { headers: headers() }),
            request("/dashboard/resumen", { headers: headers() }),
            request("/radicados", { headers: headers() }),
            request("/clientes", { headers: headers() }),
            request("/procesos", { headers: headers() }),
            request("/reportes", { headers: headers() }),
            request("/notificaciones", { headers: headers() }),
            request("/consultas", { headers: headers() }),
            request("/programacion", { headers: headers() }),
            request("/admin/organizacion", { headers: headers() }),
            request("/admin/usuarios", { headers: headers() }),
            request("/admin/auditoria", { headers: headers() }),
          ]);
          Object.assign(state, { me, resumen, radicados, clientes: clientesData, procesos, reportes, notificaciones, consultas, programacion, organizacion, usuarios, auditoria });
          render();
        } catch (error) {
          setLog(`Error cargando datos: ${error.message}`);
        }
      }
      // Carga manual de radicados desde texto pegado por el usuario.
      async function addManual() {
        const raw = document.getElementById("manualRadicados")?.value || "";
        const etiqueta = document.getElementById("clienteRadicados")?.value?.trim() || clienteActual();
        const numeros = raw.split(/\r?\n|,|;/).map((x) => x.trim()).filter(Boolean);
        if (!numeros.length) return setLog("Agrega al menos un radicado.");
        try {
          const data = await request("/radicados", {
            method: "POST",
            headers: jsonHeaders(),
            body: JSON.stringify({ numeros, etiqueta }),
          });
          if (etiqueta) setCliente(etiqueta);
          await refresh();
          setLog("Radicados agregados.", data);
        } catch (error) {
          setLog(`No se pudieron agregar radicados: ${error.message}`);
        }
      }
      async function createCliente() {
        const input = document.getElementById("clienteRadicados");
        const nombre = input?.value?.trim() || clienteActual();
        if (!nombre) return setLog("Escribe el nombre del cliente/carpeta.");
        try {
          await request("/clientes", {
            method: "POST",
            headers: jsonHeaders(),
            body: JSON.stringify({ nombre }),
          });
          state.selectedCliente = nombre;
          localStorage.setItem("selected_cliente", nombre);
          await refresh();
          setLog(`Cliente/carpeta guardado: ${nombre}`);
        } catch (error) {
          setLog(`No se pudo guardar el cliente/carpeta: ${error.message}`);
        }
      }
      // Carga masiva desde Excel con renovacion de sesion antes de enviar el archivo.
      async function uploadExcel(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (!state.token && !await refreshSession()) {
          event.target.value = "";
          return setLog("Tu sesion vencio. Inicia sesion de nuevo para cargar el Excel.");
        }
        const form = new FormData();
        form.append("file", file);
        const etiqueta = document.getElementById("clienteRadicados")?.value?.trim() || clienteActual();
        if (etiqueta) form.append("etiqueta", etiqueta);
        try {
          const data = await request("/radicados/upload", { method: "POST", headers: headers(), body: form });
          if (etiqueta) setCliente(etiqueta);
          await refresh();
          setLog("Excel cargado.", data);
        } catch (error) {
          setLog(`No se pudo cargar el Excel: ${error.message}`);
        } finally {
          event.target.value = "";
        }
      }
      // Descarga publica de la plantilla para reducir friccion antes de cargar datos.
      async function downloadTemplate() {
        try {
          const response = await fetch(`${API}/radicados/template`);
          if (!response.ok) throw new Error(await response.text() || "No se pudo descargar la plantilla");
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "listado_radicados_template.xlsx";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          setLog("Plantilla descargada. Completa la columna Radicado y cargala desde esta pantalla.");
        } catch (error) {
          setLog(`No se pudo descargar la plantilla: ${error.message}`);
        }
      }
      // Ejecuta el scraper en segundo plano y abre el seguimiento por polling.
      async function executeScraper() {
        state.busy = true;
        const cliente = clienteActual();
        setLog(cliente ? `Encolando consulta para cliente: ${cliente}` : "Encolando consulta. El scraper correra en segundo plano.");
        try {
          const data = await request("/consultas/ejecutar", {
            method: "POST",
            headers: jsonHeaders(),
            body: JSON.stringify(cliente ? { cliente } : {}),
          });
          state.activeConsulta = data;
          startPolling(data.consulta_id);
          await refresh();
          setLog("Consulta iniciada. Puedes seguir usando el panel mientras Selenium trabaja.", data);
        } catch (error) {
          setLog(`Fallo la consulta: ${error.message}`);
          state.busy = false;
          render();
        }
      }
      async function buscarPublicaciones(event) {
        event.preventDefault();
        const form = new FormData(event.target);
        state.busquedaLoading = true;
        state.busquedaPublicaciones = null;
        render();
        try {
          const payload = {
            numero_proceso: form.get("numero_proceso"),
            fecha_desde: form.get("fecha_desde") || null,
            fecha_hasta: form.get("fecha_hasta") || null,
            tipo_publicacion: form.get("tipo_publicacion") || null,
            despacho: form.get("despacho") || null,
            ciudad: form.get("ciudad") || null,
          };
          const data = await request("/api/procesos/buscar", {
            method: "POST",
            headers: jsonHeaders(),
            body: JSON.stringify(payload),
          });
          state.busquedaPublicaciones = data;
          setLog("Busqueda de publicaciones finalizada.", data);
        } catch (error) {
          setLog(`No se pudo buscar publicaciones: ${error.message}`);
        } finally {
          state.busquedaLoading = false;
          render();
        }
      }
      async function buscarPublicacionesPortal() {
        const numero = (state.filtros.radicado || state.procesoSearch || "").trim();
        if (!numero) return setLog("Ingresa una radicacion para consultar publicaciones oficiales.");
        state.busquedaLoading = true;
        state.busquedaPublicaciones = null;
        render();
        try {
          const data = await request("/api/procesos/buscar", {
            method: "POST",
            headers: jsonHeaders(),
            body: JSON.stringify({
              numero_proceso: numero,
              tipo_publicacion: state.filtros.estado || null,
              despacho: state.filtros.juzgado || null,
              ciudad: state.filtros.juzgado || null,
            }),
          });
          state.busquedaPublicaciones = data;
          setLog("Busqueda oficial finalizada.", data);
        } catch (error) {
          setLog(`No se pudo buscar en fuente oficial: ${error.message}`);
        } finally {
          state.busquedaLoading = false;
          render();
        }
      }
      // Consulta el avance de una ejecucion activa hasta completarse o fallar.
      function startPolling(consultaId) {
        if (state.poller) clearInterval(state.poller);
        state.poller = setInterval(async () => {
          try {
            const data = await request(`/consultas/${consultaId}`, { headers: headers() });
            state.activeConsulta = data;
            state.busy = ["pendiente", "ejecutando"].includes(data.estado);
            if (!state.busy) {
              clearInterval(state.poller);
              state.poller = null;
              await refresh();
              setLog("Consulta finalizada.", data);
            } else {
              render();
            }
          } catch (error) {
            clearInterval(state.poller);
            state.poller = null;
            state.busy = false;
            setLog(`No se pudo consultar el progreso: ${error.message}`);
          }
        }, 2000);
      }
      // Renderiza la tarjeta de avance de Selenium.
      function renderProgress() {
        const c = state.activeConsulta;
        if (!c) return "";
        const progreso = c.progreso ?? (c.total_radicados ? Math.round((c.total_procesados / c.total_radicados) * 100) : 0);
        const active = ["pendiente", "ejecutando"].includes(c.estado);
        return `
          <div class="panel progressCard">
            <div class="panelHeader">
              <div>
                <h3>Scraper en ejecucion</h3>
                <p class="muted">Consulta #${c.consulta_id} ${active ? "procesando radicados" : "finalizada"}</p>
              </div>
              <div class="row">
                ${statusBadge(c.estado, active ? "warn" : "")}
                ${statusBadge(`${Math.min(progreso, 100)}%`)}
              </div>
            </div>
            <div class="progressTrack">
              <div class="progressFill ${active ? "active" : ""}" style="width: ${Math.min(progreso, 100)}%"></div>
            </div>
            <div class="progressMeta">
              <div><span>Procesados</span><strong>${c.total_procesados || 0}/${c.total_radicados || 0}</strong></div>
              <div><span>Novedades</span><strong>${c.total_novedades || 0}</strong></div>
              <div><span>Errores</span><strong>${c.total_errores || 0}</strong></div>
            </div>
            <p class="muted">${esc(c.ultimo_mensaje || "Esperando estado...")}</p>
          </div>
        `;
      }
      function renderConsultasTable() {
        if (!state.consultas.length) return `<div class="empty">Sin ejecuciones registradas todavia.</div>`;
        return `
          <div class="tableWrap">
            <table>
              <thead><tr><th>ID</th><th>Estado</th><th>Progreso</th><th>Novedades</th><th>Errores</th><th>Mensaje</th></tr></thead>
              <tbody>${state.consultas.map((c) => `<tr><td>${c.consulta_id}</td><td>${statusBadge(c.estado)}</td><td>${c.total_procesados}/${c.total_radicados}</td><td>${c.total_novedades}</td><td>${c.total_errores}</td><td>${esc(c.ultimo_mensaje || "")}</td></tr>`).join("")}</tbody>
            </table>
          </div>
        `;
      }
      // Guarda la configuracion de Telegram sin exponer el token completo al cliente.
      async function saveTelegram(event) {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          const data = await request("/notificaciones", {
            method: "PUT",
            headers: jsonHeaders(),
            body: JSON.stringify({
              canal: "telegram",
              destino: form.get("destino"),
              bot_token: form.get("bot_token"),
              habilitada: form.get("habilitada") === "on",
            }),
          });
          await refresh();
          setLog("Configuracion de Telegram guardada.", data);
        } catch (error) {
          setLog(`No se pudo guardar Telegram: ${error.message}`);
        }
      }
      async function testTelegram() {
        try {
          const data = await request("/notificaciones/test", { method: "POST", headers: headers() });
          setLog("Prueba de Telegram enviada.", data);
        } catch (error) {
          setLog(`No se pudo enviar la prueba: ${error.message}`);
        }
      }
      // Configura consultas recurrentes para operar sin intervencion manual.
      async function saveProgramacion(event) {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          const data = await request("/programacion", {
            method: "PUT",
            headers: jsonHeaders(),
            body: JSON.stringify({
              habilitada: form.get("habilitada") === "on",
              intervalo_horas: Number(form.get("intervalo_horas") || 24),
            }),
          });
          await refresh();
          setLog("Programacion guardada.", data);
        } catch (error) {
          setLog(`No se pudo guardar programacion: ${error.message}`);
        }
      }
      // Cambia la password del usuario autenticado.
      async function changePassword(event) {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          await request("/auth/change-password", {
            method: "POST",
            headers: jsonHeaders(),
            body: JSON.stringify({
              current_password: form.get("current_password"),
              new_password: form.get("new_password"),
            }),
          });
          event.target.reset();
          setLog("Password actualizada correctamente.");
        } catch (error) {
          setLog(`No se pudo cambiar password: ${error.message}`);
        }
      }
      // Ajustes administrativos de la organizacion comercial.
      async function saveOrganizacion(event) {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          const data = await request("/admin/organizacion", {
            method: "PUT",
            headers: jsonHeaders(),
            body: JSON.stringify({
              nombre: form.get("nombre"),
              limite_radicados: Number(form.get("limite_radicados") || 500),
              activa: form.get("activa") === "on",
            }),
          });
          await refresh();
          setLog("Organizacion actualizada.", data);
        } catch (error) {
          setLog(`No se pudo guardar la organizacion: ${error.message}`);
        }
      }
      // Alta de usuarios por rol para separar operacion y lectura.
      async function createUsuario(event) {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          const data = await request("/admin/usuarios", {
            method: "POST",
            headers: jsonHeaders(),
            body: JSON.stringify({
              email: form.get("email"),
              nombre: form.get("nombre"),
              password: form.get("password"),
              rol: form.get("rol"),
            }),
          });
          event.target.reset();
          await refresh();
          setLog("Usuario creado.", data);
        } catch (error) {
          setLog(`No se pudo crear el usuario: ${error.message}`);
        }
      }
      // Abre el detalle normalizado del proceso y su historial.
      async function openProceso(radicado) {
        try {
          state.selected = await request(`/procesos/${encodeURIComponent(radicado)}`, { headers: headers() });
          state.previousView = state.view === "hoja" ? state.previousView : state.view;
          state.view = "hoja";
          render();

        if (checked && !state.selectedRadicados.includes(id)) state.selectedRadicados.push(id);
        if (!checked) state.selectedRadicados = state.selectedRadicados.filter((item) => item !== id);
        render();

      function toggleAllRadicados(checked) {
        const visibles = state.radicados.filter((r) => !clienteActual() || r.etiqueta === clienteActual());
        state.selectedRadicados = checked ? visibles.map((r) => r.id) : [];
        render();

      async function editSelectedRadicado() {
        if (state.selectedRadicados.length !== 1) return setLog("Selecciona exactamente un radicado para editar.");
        const item = state.radicados.find((r) => r.id === state.selectedRadicados[0]);
        if (!item) return setLog("No se encontro el radicado seleccionado.");
        const numero = prompt("Editar numero de radicado", item.numero);
        if (numero === null) return;
        const etiqueta = prompt("Cliente/carpeta", item.etiqueta || "");
        if (etiqueta === null) return;
        try {
          await request(`/radicados/${item.id}`, {
            method: "PUT",
            headers: jsonHeaders(),
            body: JSON.stringify({ numero, etiqueta }),
          });
          state.selectedRadicados = [];
          await refresh();
          setLog("Radicado actualizado.");
        } catch (error) {
          setLog(`No se pudo editar el radicado: ${error.message}`);
        }
      }
      async function assignClientSelectedRadicados() {
        if (!state.selectedRadicados.length) return setLog("Selecciona radicados para asignar cliente/carpeta.");
        const etiqueta = prompt("Cliente/carpeta para los radicados seleccionados", clienteActual());
        if (etiqueta === null) return;
        try {
          for (const id of state.selectedRadicados) {
            await request(`/radicados/${id}`, {
              method: "PUT",
              headers: jsonHeaders(),
              body: JSON.stringify({ etiqueta }),
            });
          }
          state.selectedCliente = etiqueta;
          localStorage.setItem("selected_cliente", etiqueta);
          state.selectedRadicados = [];
          await refresh();
          setLog("Cliente/carpeta asignado a los radicados seleccionados.");
        } catch (error) {
          setLog(`No se pudo asignar cliente/carpeta: ${error.message}`);
        }
      }
      async function deleteSelectedRadicados() {
        if (!state.selectedRadicados.length) return setLog("Selecciona radicados para eliminar.");
        if (!confirm(`Eliminar ${state.selectedRadicados.length} radicado(s) seleccionado(s)?`)) return;
        try {
          for (const id of state.selectedRadicados) {

      function portalDayCards() {
        const formatterMonth = new Intl.DateTimeFormat("es-CO", { month: "long", year: "numeric" });

        return Array.from({ length: 5 }).map((_, index) => {
          const date = new Date();
          date.setDate(date.getDate() - index);
          const day = String(date.getDate()).padStart(2, "0");
          const month = formatterMonth.format(date).replace(/^./, (c) => c.toUpperCase());
          const week = formatterWeek.format(date).replace(/^./, (c) => c.toUpperCase());
          return `<div class="dayCard"><strong>${day}</strong><span>${esc(month)}</span><small>${esc(week)}</small></div>`;

              </div>
              <div class="twoCols">
                <label class="field"><span>Ciudad / despacho</span><input value="${esc(state.filtros.juzgado)}" oninput="state.filtros.juzgado=this.value" /></label>
                <label class="field"><span>Tipo / actuacion</span><select onchange="state.filtros.estado=this.value">
                  <option value="">Todos</option>
                  <option value="auto" ${state.filtros.estado === "auto" ? "selected" : ""}>Auto</option>
                  <option value="estado" ${state.filtros.estado === "estado" ? "selected" : ""}>Estado</option>
                  <option value="monitoreado" ${state.filtros.estado === "monitoreado" ? "selected" : ""}>Monitoreado</option>
                </select></label>
              </div>
              <div class="row">
                <button>Buscar en base</button>
                <button type="button" class="secondary" onclick="buscarPublicacionesPortal()" ${state.busquedaLoading ? "disabled" : ""}>Consultar fuente oficial</button>
                <button type="button" class="ghost" onclick="clearBusqueda()">Limpiar</button>
              </div>
              <pre class="log">${esc(state.log)}</pre>
            </form>
            <section class="panel">
              <div class="sectionToolbar">
                <div><h3>Resultados ${clienteActual() ? `para ${esc(clienteActual())}` : "consolidados"}</h3><p class="muted">${local.length} coincidencia(s) en la base local.</p></div>
                <button class="secondary" onclick="setView('radicados')">Administrar bases</button>
              </div>
              <div class="tableWrap">
                <table>
                  <thead><tr><th>Cliente/Base</th><th>Radicado</th><th>Partes</th><th>Despacho</th><th>Ultima actuacion</th><th></th></tr></thead>
                  <tbody>${local.map((p) => `<tr><td>${esc(p.cliente || "Sin cliente")}</td><td>${esc(p.radicado)}</td><td><strong>${esc(p.demandante || "No identificado")}</strong><br>${esc(p.demandado || "No identificado")}</td><td>${esc(p.juzgado || "No identificado")}</td><td>${esc(p.fecha_ultima_actuacion || "Sin fecha")}<br>${p.auto_importante ? statusBadge("IMPORTANTE AUTO", "important") : esc(p.ultima_actuacion || "Sin actuacion")}</td><td><button class="secondary" onclick="openProceso('${esc(p.radicado)}')">Hoja de vida</button></td></tr>`).join("") || `<tr><td colspan="6"><div class="empty">No hay coincidencias para esta base o filtros.</div></td></tr>`}</tbody>
                </table>
              </div>
            </section>
          </section>
          <section class="panel">
            <div class="sectionToolbar">
              <div><h3>Fuente oficial y documentos</h3><p class="muted">Resultado de la consulta externa por radicado cuando la solicites.</p></div>
            </div>
            ${renderPublicacionesResult()}
          </section>
        `, "Buscar proceso", "Filtrado por cliente, radicado, partes, despacho y fuente oficial.");
      }
      function renderHojaVida() {
        const p = state.selected;
        if (!p) return renderProcesos();
        const historial = p.historial || [];
        renderShell(`
          <section class="detailHeader">
            <div class="detailTitleRow">
              <div>
                <h3>${esc(p.radicado)}</h3>
                <p class="muted">${esc(p.cliente || "Sin cliente")} · ${esc(p.juzgado || "Despacho no identificado")}</p>
              </div>
              <div class="row">
                <button class="secondary" onclick="volverDesdeHoja()">Volver</button>
                <button class="secondary" onclick="window.print()">Imprimir</button>
                <button class="secondary" onclick="refresh()">Actualizar</button>
                <a class="fileButton" href="${API}/reportes/excel${p.cliente ? `?cliente=${encodeURIComponent(p.cliente)}` : ""}">Excel</a>
              </div>
            </div>
            <div class="detailGrid">
              <div class="infoBlock"><span>Demandante</span><strong>${esc(p.demandante || "No identificado")}</strong></div>
              <div class="infoBlock"><span>Demandado</span><strong>${esc(p.demandado || "No identificado")}</strong></div>
              <div class="infoBlock"><span>Ultima actuacion</span><strong>${esc(p.fecha_ultima_actuacion || "Sin fecha")}</strong><p class="muted">${esc(p.ultima_actuacion || "Sin actuacion")}</p></div>
            </div>
            ${p.auto_importante ? `<div>${statusBadge("IMPORTANTE AUTO", "important")} <span class="muted">${esc(p.fecha_auto_importante || "")} ${esc(p.titulo_auto_importante || "")}</span></div>` : ""}
          </section>
          <section class="panel">
            <div class="sectionToolbar">
              <div><h3>Actuaciones procesales</h3><p class="muted">Historial guardado para comparar novedades futuras y alertar solo cambios nuevos.</p></div>
              <button class="secondary" onclick="state.filtros.radicado='${esc(p.radicado)}'; state.view='buscar'; render()">Buscar fuente oficial</button>
            </div>
            <div class="statusList">
              ${historial.map((h) => `<article class="actuationCard ${h.importante_auto ? "importantAct" : ""}">${h.importante_auto ? statusBadge("IMPORTANTE AUTO", "important") : ""}<div class="sectionToolbar"><strong>${esc(h.fecha || "Sin fecha")} · ${esc(h.titulo || "Actuacion")}</strong><span class="muted">ID ${h.id}</span></div><p class="muted">${esc(h.descripcion || "Sin anotacion")}</p></article>`).join("") || `<div class="empty">Sin historial registrado.</div>`}
            </div>
          </section>
        `, "Hoja de vida", "Detalle operativo del proceso y sus actuaciones.");
      }
      function render() {
        if (!state.token) return renderLogin();
        if (state.view === "hoja") return renderHojaVida();
        if (state.view === "radicados") return renderRadicados();
        if (state.view === "buscar") return renderBusqueda();
        if (state.view === "procesos") return renderProcesos();
        if (state.view === "reportes") return renderReportes();
        if (state.view === "config") return renderConfig();
        if (state.view === "admin") return renderAdmin();
        return renderDashboard();
      }
      render();
      if (state.token) refresh();
    </script>
  </body>
</html>
